name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true


      - name: Prepare Environment File
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
              echo "Created .env from .env.example"
            else
              touch .env
              echo "Created empty .env"
            fi
          fi

      - name: Ensure Gradle Wrapper Executable
        run: |
          if [ ! -f gradlew ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Prepare Signing Keystore
        id: prepare-keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using provided KEYSTORE_BASE64 secret..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-upload-key.jks
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "No custom keystore secret detected; generating automated release keystore..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${{ secrets.STORE_PASSWORD || 'zenmathpass123' }}" \
              -keypass "${{ secrets.KEY_PASSWORD || 'zenmathpass123' }}" \
              -dname "CN=ZenMath, O=ZenMath, C=US"
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD || 'zenmathpass123' }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD || 'zenmathpass123' }}" >> $GITHUB_ENV
          fi

      - name: Build Release APK with Gradle
        env:
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Determine Release Tag and Name
        id: release-info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            TITLE="ZenMath ${TAG}"
          else
            TAG="v1.0.${{ github.run_number }}"
            TITLE="ZenMath v1.0 (Build ${{ github.run_number }})"
          fi
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          echo "RELEASE_TITLE=${TITLE}" >> $GITHUB_ENV
          
          # Copy to user-friendly APK filename
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/ZenMath-${TAG}.apk"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenmath-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
